name: CI

on:
  push:
  pull_request:

# Least-privilege default: the GITHUB_TOKEN this workflow gets only needs to
# read repo contents to check out code and build. Keeping this minimal (no
# checks/pull-requests/statuses write) avoids granting scope that other
# integrations (e.g. SonarCloud) could pick up on for this repo.
permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t snipe-it-license-sync .

  lockfile:
    # uv.lock is the single source of truth; fail if it no longer matches
    # pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.7"

      - run: uv lock --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.7"

      - name: Install dependencies
        # --frozen installs exactly what uv.lock pins.
        run: uv sync --frozen --python 3.12

      - name: Compile check
        run: uv run --frozen python -m py_compile ./*.py

      - name: Run tests
        run: |
          if find . -maxdepth 2 \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            PYTHONPATH=. uv run --frozen pytest -v
          else
            echo "No tests found yet — skipping pytest run."
          fi
